version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  fl_chart: ^0.69.0
  syncfusion_flutter_charts: ^26.0.0
  syncfusion_flutter_gauges: ^26.0.0
  graphic: ^2.2.0
  community_charts_flutter: ^1.0.4
dev_dependencies:
